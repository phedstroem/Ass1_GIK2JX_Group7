<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Webmapp Group 7</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='src/leaflet.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='src/css/bootstrap.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='src/plugins/L.Control.Zoomslider.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='src/plugins/L.Control.Sidebar.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/MarkerCluster.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/MarkerCluster.Default.css') }}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@kalisio/leaflet.donutcluster@1.1.0/src/Leaflet.DonutCluster.css">
        
        <script src="{{ url_for('static', filename='src/leaflet-src.js') }}"></script>
        <script src="{{ url_for('static', filename='src/jquery-3.6.0.min.js') }}"></script>
        <script src="{{ url_for('static', filename='src/turf.min.js') }}" charset="utf-8"></script>
        <script src="{{ url_for('static', filename='src/plugins/L.Control.Zoomslider.js') }}"></script>
        <script src="{{ url_for('static', filename='src/plugins/L.Control.Sidebar.js') }}"></script>
        <script src="{{ url_for('static', filename='dist/leaflet.markercluster.js') }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/@kalisio/leaflet.donutcluster@1.1.0/src/Leaflet.DonutCluster.js"></script>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        
        <style>
            #mapdiv {
                height: 100vh;
            }  
            
            #side-bar {
			position: absolute;
			z-index: 1000;
			background: #1b2732;
            color: white;
			padding: 40px;
			right: 0;
            top: 0;
			margin: 10px;
            border: #0b0e0b solid 3px;
			border-radius: 10px;
            box-shadow: #0b0e0b 5px 5px 15px;
			min-height: 99%;
            }
            /* Design av knapparna */
            #side-bar button {
                background-color: #4CAF50; 
                color: white;
                padding: 8px 25px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 30px;
                margin: 15px 10px 30px 10px;
                cursor: pointer;
                border-radius: 8px;
                box-shadow: #3c673d 2px 2px 5px; 
                transition: 0.3s;
            }
            
            /* Hover-effekt för knapparna */
            #side-bar button:hover {
                background-color: #225424;
                transform: scale(1.2); /* Gör knappen lite större vid hovring */
            }
            
            .sidebar-footer-text {
                position: absolute;
                bottom: 20px;
                left: 30px;
                font-size: 30px;
                color: white;
            }
                        
        </style>
    </head>
    <body>
       <div id="mapdiv" class="col-md-9"></div>
       
       <div id="side-bar" class="col-md-3">
            <h1 align="center">--Tasks--</h1>
            
            <button id="t1">Task 1</button>
            <button id="t2">Task 2</button>
            <button id="t3">Task 3</button>
            <button id="t4">Task 4</button>
            <button id="t5">Task 5</button>
            <button id="t5_1">Task 5.1</button>
            <button id="t6">Task 6</button>
            <button id="t7">Task 7</button>
            <button id="t8">Task 8</button>

            <div class="sidebar-footer-text">Grupp 7 <br> Rickard Andersson <br> Fredrik Domert Eriksson <br> Pär Hedström</div>
  
       </div>

       <div id="sidebar"></div>
       
        
       <script>
            var mymap; 
            var lyrOSM; 
            var mrkCurrentLocation;
            var ctlZoomslider;

            
            $(document).ready(function(){
                mymap = L.map('mapdiv', {center:[60.48868922712431, 15.421371459960938], zoom:13});
                lyrOSM= L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
                mymap.addLayer(lyrOSM);
                // Initiera sidebar-kontrollen
                var sidebar = L.control.sidebar('sidebar', {
                    position: 'left'
                });
                mymap.addControl(sidebar);
                
                ctlZoomslider = L.control.zoomslider({position:'topright'}).addTo(mymap);
                

                // Task 1 
                // Punkten 
                var point = L.marker([60.484229422052806, 15.417932404301126]) 
                    .bindPopup("<h4>Kupolen</h4><p>Ett shoppingcenter i Borlänge</p><img src='static/img/Kupolen.png' width='200px'>");
                // Linjen
                var line = L.polyline([[60.48954511346011, 15.42504208778226], [60.603974949628025, 15.622487368169402]], {color: 'red'})
                    .bindPopup("<h4>Blg-Falun</h4><p>Fågelvägen mellan Borlänge och Falun</p><img src='static/img/Fagelvagen.png' width='200px'>")
                // Polygon
                var polygon = L.polygon([[61.15100465267432, 14.452944288711791], [60.906107491709776, 14.429290785709469],[60.6594017680805,15.034829030131021],[60.92096459775286,15.184183945038825],[61.02795305124883,14.68370950226361],[61.15179064615006,14.704061627751656]], {color:'Green'})
                    .bindPopup("<h4>Siljansbygden</h4><p>Det natursköna området runt siljan</p><img src='static/img/Dalabild.png' width='200px'>")

                document.getElementById("t1").addEventListener("click", taskOne);

		          function taskOne(){
                      if(mymap.hasLayer(point)){
                          mymap.removeLayer(point); // Räcker med en här
                          mymap.removeLayer(line);
                          mymap.removeLayer(polygon);
                
                          
                      } else {
                          point.addTo(mymap);
                          line.addTo(mymap);
                          polygon.addTo(mymap);
            
                      }
                      // Zomma till rimlig nivå
                        mymap.setView([60.82153127616442, 15.188165406846565], 10);
			
		          };

                // Task 2 
                // 5 platser i Borlänge
                var locations = [
                   {name: "Kupolen", info: "Kupolen invigdes i september 1990 och var från början ett två våningar kombinerat köpcentrum och evenemangsarena med arenan på plan två. 1995 byggdes ett nytt våningsplan mellan befintligt köpcentrum och arenadelen och Kupolen rymde då dubbelt så många butiker som tidigare.", 
                   coords: [60.48431177234703, 15.417914177542558]},
                   {name: "Högskolan Dalarna", info: "2024 flyttade högskolan in på Campus Borlänge och blev Sveriges nyaste campus beläget mitt i centrum. På campuset samlas utbildning och forskning inom data och it, turism, samhälle, ekonomi och teknik.", 
                   coords: [60.48541756471926, 15.431149647723439]},
                   {name: "Borlänge Central", info: "Borlänge centralstation, kortform Borlänge C, är en järnvägsstation i centrala Borlänge. Här korsar Bergslagsbanan Dalabanan. Stationen har ett resecentrum för Dalatrafiks busstrafik och var också utgångspunkt för trafiken på Västerdalsbanan.", 
                   coords: [60.48368526878917, 15.425825082084334]},
                   {name: "Maserhallen", info: "Maserhallen är en idrottsanläggning för inomhusidrott i Borlänge som stod klar 1967. I Maserhallen finns det två inomhushallar, en bowlinghall, en 25 m simbassäng med hopptorn, ett äventyrsbad (Aqua Nova) med relaxavdelning och två gym.", 
                   coords: [60.49171904177596, 15.411760191848018]},
                   {name: "2047 Science Center", info: "Verksamheten öppnade 1986 under namnet Framtidsmuseet. Det var då inrymt som en del av Folkets hus i Borlänge. 2017 tog man ner skylten Framtidsmuseet och bytte namn till 2047 Science Center. Namnbytet motiverades med att man inte såg sig som ett museum utan som ett mer modernt inriktat vetenskapscentrum ", 
                   coords: [60.48810656462385, 15.430697561929076]}
];
                
                  // Skapar en grupp så att vi enkelt kan lägga till och ta bort alla markörer samtidigt
                  var task2LayerGroup = L.layerGroup();

                // Event listener för Task 2 knappen
                document.getElementById("t2").addEventListener("click", function() {
                    if (mymap.hasLayer(task2LayerGroup)) {
                        mymap.removeLayer(task2LayerGroup);
                    } 
                    // Skapa punkterna och lägg till dem
                    else {
                        locations.forEach(function(loc) {
                            var marker = L.marker(loc.coords);
                            marker.on('click', function() {
                                sidebar.setContent(`
                                    <div style="padding: 15px; font-size: 24px;"> <h2 style="font-size: 36px;">${loc.name}</h2> <hr>
                                        <p><b>Information:</b> ${loc.info}</p>
                                    </div>
                                `);
                                sidebar.show(); 
                            });
                            task2LayerGroup.addLayer(marker); // Lägg till markern i gruppen
                        });
                        task2LayerGroup.addTo(mymap); // Lägg till hela gruppen på kartan
                        mymap.setView([60.485, 15.42], 14);
                    }

                    // Zoomar till området
                    mymap.setView([60.485, 15.42], 14);
                });

                // Task 3
                var task3LayerGroup = L.layerGroup(); // Grupp för butiker och buffertar

                document.getElementById("t3").addEventListener("click", function() {
                    // Om lagret redan finns -> Ta bort det
                    if (mymap.hasLayer(task3LayerGroup)) {
                        mymap.removeLayer(task3LayerGroup);
                    } 
                    // Kör analysen och lägg till på kartan
                    else {
                        $.getJSON("/static/data/supermarket.geoJSON", function(data) {
                            var allBuffers = [];
                            
                            // Först skapar vi butikslagret
                            var stores = L.geoJson(data, {
                                onEachFeature: function (feature, layer) {
                                    layer.bindPopup('<div style="font-size: 25px;"><b>Butik: </b>' + feature.properties.name + '</div>');
                                    allBuffers.push(turf.buffer(feature, 1, {units: 'kilometers'}));
                                }
                            });
                            task3LayerGroup.addLayer(stores); // Lägg till butiker i gruppen
                
                            // Här skapar vi buffertarna
                            allBuffers.forEach(function(currentBuffer, index) {
                                var isOverlapping = false;
                                allBuffers.forEach(function(otherBuffer, otherIndex) {
                                    if (index !== otherIndex && turf.intersect(currentBuffer, otherBuffer)) {
                                        isOverlapping = true;
                                    }
                                });
                
                                var bufferLayer = L.geoJson(currentBuffer, {
                                    style: {
                                        color: isOverlapping ? "red" : "green",
                                        fillOpacity: 0.2
                                    }
                                });
                                task3LayerGroup.addLayer(bufferLayer); // Lägg till buffer i gruppen
                            });
                
                            task3LayerGroup.addTo(mymap); // Visa allt på kartan
                            mymap.fitBounds(stores.getBounds());
                        });
                    }
                });
                // Task 4 - bild över Dalarna
                var imageOverlayLayer; 

                document.getElementById("t4").addEventListener("click", function() {
                    
                    if (imageOverlayLayer && mymap.hasLayer(imageOverlayLayer)) {
                        mymap.removeLayer(imageOverlayLayer);
                    } 
                    else {
                        
                        var imageUrl = '/static/img/Dalarna.jpg';
                        
                        var imageBounds = [[59.85, 12.18], [62.29, 16.80]]; 
                        
                        imageOverlayLayer = L.imageOverlay(imageUrl, imageBounds, {
                            opacity: 0.6 
                        });
                        
                        imageOverlayLayer.addTo(mymap);
                        mymap.fitBounds(imageBounds);
                    }
                });

                // Task 5
                var fuelClusterGroup; // Variabel för klustret

                document.getElementById("t5").addEventListener("click", function() {
                    // Om klustret finns, ta bort det
                    if (fuelClusterGroup && mymap.hasLayer(fuelClusterGroup)) {
                        mymap.removeLayer(fuelClusterGroup);
                    } 
                    
                    else {
                        
                        fuelClusterGroup = L.markerClusterGroup();

                        $.getJSON("/static/data/fuel.geojson", function(data) {
                            
                            
                            var fuelLayer = L.geoJson(data, {
                                onEachFeature: function(feature, layer) {
                                    
                                    var stationName = feature.properties.name || "Okänd bensinstation";
                                    var brand = feature.properties.brand || "";
                                    
                                    layer.bindPopup("<div style='font-size: 16px;'><b>" + stationName + "</b><br>" + brand + "</div>");
                                }
                            });

                            //  Stoppa in punkterna i kluster-containern
                            fuelClusterGroup.addLayer(fuelLayer);

                            //  Lägg till containern på kartan
                            mymap.addLayer(fuelClusterGroup);

                            //  Zooma så allt syns
                            mymap.fitBounds(fuelLayer.getBounds());
                        });
                    }
                });

                // Task 5.1 - DonutCluster
                var donutClusterGroup; 
               
                document.getElementById("t5_1").addEventListener("click", function() {
                    
                    if (donutClusterGroup && mymap.hasLayer(donutClusterGroup)) {
                        mymap.removeLayer(donutClusterGroup);
                    } 
                    else {
                        $.getJSON("/static/data/fuel.geojson", function(data) {
                                                       
                            donutClusterGroup = L.DonutCluster(
                                {}, 
                                {   
                                    key: 'brand', 
                                    arcColorDict: {
                                        'OKQ8': 'blue',
                                        'Circle K': 'orange',
                                        'Preem': 'green',
                                        'INGO': 'red',
                                        'St1': 'purple',
                                        'Qstar': 'yellow',
                                        'Din-X': 'brown'
                                    },
                                    defaultColor: 'gray', 
                                    arcWidth: 6,
                                    titleColor: 'black',
                                    size: 50
                                }
                            );
                           
                            L.geoJson(data, {
                                onEachFeature: function(feature, layer) {
                                    var stationName = feature.properties.name || "Okänd bensinstation";
                                    var brand = feature.properties.brand || "Okänt märke";
                                    
                                    layer.bindPopup("<div style='font-size: 16px;'><b>" + stationName + "</b><br>Märke: " + brand + "</div>");
                                                                       
                                    layer.options.brand = brand;
                                                                        
                                    donutClusterGroup.addLayer(layer);
                                }
                            });

                            // Lägg till allt på kartan
                            mymap.addLayer(donutClusterGroup);
                            mymap.fitBounds(donutClusterGroup.getBounds());
                        });
                    }
                });

                // Task 6

                // platserna där vi visa temperatur
                var tempLocations = [
                   {name: "Borlänge", info: "Borlänge", 
                   coords: [60.481424756432915, 15.428001437016889]},
                   {name: "Falun", info: "Falun", 
                   coords: [60.60787960601539, 15.640291042780945]},
                   {name: "Djurås", info: "Djurås", 
                   coords: [60.559970355514906, 15.129291307869408]},
                   {name: "Leksand", info: "Leksand", 
                   coords: [60.73584063135766, 15.000834527046777]},
                   {name: "Ludvika", info: "Ludvika", 
                   coords: [60.14556030882662, 15.180324421453832]}
            ];


                // Skapar en grupp så att vi enkelt kan lägga till och ta bort alla markörer samtidigt
                  var task6LayerGroup = L.layerGroup();

                // Event listener för Task 6 knappen
                document.getElementById("t6").addEventListener("click", function() {
                    if (mymap.hasLayer(task6LayerGroup)) {
                        mymap.removeLayer(task6LayerGroup);
                    } 
                    // Skapa punkterna och lägg till dem
                    else {
                        tempLocations.forEach(function(loc) {
                            var marker = L.marker(loc.coords);
                            
                            // Här gör vi en "grund popup" som visas direkt innan vädret hunnit hämtas
                            marker.bindPopup(`
                            <div>
                            <h4>${loc.name}</h4>
                            <p>Väderdata hämtas...</p>
                            </div>`
                            );

                            marker.on('click', function() {
                                // Spar url med rätt kordinater från Open-Meteo.com
                                const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.coords[0]}&longitude=${loc.coords[1]}&daily=temperature_2m_max,temperature_2m_min&current=temperature_2m&timezone=auto&past_days=0&forecast_days=7`;

                                // hämtar väderdata från url - Open-Meteo
                                $.getJSON(url, function(data) {
                                    const currentTemp = data.current.temperature_2m;

                                    //Uppdaterar popupen
                                    marker.setPopupContent(
                                        `<div>
                                            <h4>${loc.name}</h4>
                                            <p>Väder just nu: ${currentTemp} °C</p>
                                            </div>`
                                    )
                                    // Gör en lista för sidebaren med väderprognos
                                    let forecastList = `<h2>7-dagars prognos för ${loc.name}</h2><br>`;

                                    // Prognoserna från API:t kommer som en array med min och maxtemp för 7 dagar framåt, med datum, SOM vi valt. 
                                    // Vi kör igenom listan och hämtar temperaturerna
                                    data.daily.time.forEach(function(date, index) {
                                    let maxTemp = data.daily.temperature_2m_max[index];
                                    let minTemp = data.daily.temperature_2m_min[index];
                                    
                                    // Formaterar om datumet
                                    formattedDate = new Date(date).toLocaleDateString('sv-SE', { 
                                        weekday: 'short', // "mån", "tis" osv.
                                        day: 'numeric', 
                                        month: 'short'
                                    });

                                    // Vi lägger till en rad för varje dag
                                    forecastList += `<b>${formattedDate}</b><br>`;
                                    forecastList += `Maxtemp: ${maxTemp}° | Mintemp: ${minTemp}°<br><hr>`;
                                    });

                                    sidebar.setContent(forecastList);
                                    sidebar.show(); 
                                })
                                
                            });
                            task6LayerGroup.addLayer(marker); // Lägg till markern i gruppen
                        });
                        task6LayerGroup.addTo(mymap); // Lägg till hela gruppen på kartan
                        // Zomma till rimlig nivå
                        mymap.setView([60.507855040518876, 15.382499006468237], 10);
                    }

                });
                // Task 7

                var clusterLayer; // Skapar variabeln utanför så den kan nås för toggling

                document.getElementById("t7").addEventListener("click", function() {
                    if (mymap.hasLayer(clusterLayer)) {
                        mymap.removeLayer(clusterLayer);
                    } else {
                        // Ladda CSV-filen
                        d3.csv("/static/data/school_locs.csv").then(function(data) {
                            
                            // Omvandla CSV till GeoJSON-punkter
                            var points = data.map(function(d) {
                                // xcoord = longitud, ycoord = latitud
                                var lon = parseFloat(d.xcoord);
                                var lat = parseFloat(d.ycoord);
                                
                                return turf.point([lon, lat], {
                                    name: d.Name,
                                    desc: d.description
                                });
                            });
                            
                            var featureCollection = turf.featureCollection(points);
                
                            // Utför K-means clustering med 3 kluster för Stockholm
                            var numberOfClusters = 3; // Justera antalet kluster efter behov
                            var clustered = turf.clustersKmeans(featureCollection, {numberOfClusters: numberOfClusters});
                
                            // Färger för klustren - la in fler färger då jag provade med 5 kluster först
                            var colors = ['#e41a1c', '#377eb8', '#4daf4a', '#984ea3', '#ff7f00'];
                
                            // Skapa lagret
                            clusterLayer = L.geoJson(clustered, {
                                pointToLayer: function (feature, latlng) {
                                    var clusterId = feature.properties.cluster;
                                    return L.circleMarker(latlng, {
                                        radius: 15,
                                        fillColor: colors[clusterId % colors.length],
                                        color: "#fff",
                                        weight: 2,
                                        opacity: 1,
                                        fillOpacity: 0.8
                                    });
                                },
                                onEachFeature: function(feature, layer) {
                                    // Här visar vi info i sidebaren
                                    layer.on('click', function() {
                                        sidebar.setContent(`
                                            <div style="padding:15px;">
                                                <h2>${feature.properties.name}</h2>
                                                <p style="font-size: 0.9em;">${feature.properties.desc}</p>
                                                <hr>
                                                <small>Kluster: ${feature.properties.cluster}</small>
                                            </div>
                                        `);
                                        sidebar.show();
                                    });
                                    // Snabb-info vid hover
                                    layer.bindTooltip("<span style='font-size: 30px;'>" + feature.properties.name + "</span>", {
                                        permanent: false,   // Visas bara vid hover
                                        direction: "top",   // Placeras ovanför punkten
                                        offset: [0, -10]    // Flyttar upp tooltippen lite från punkten
                                    });
                                }
                            }).addTo(mymap);
                
                            // Zooma in så att alla skolor syns
                            mymap.fitBounds(clusterLayer.getBounds());
                        });
                    }
                });
             });
                
            
            

            
       </script>
    </body>
</html>
