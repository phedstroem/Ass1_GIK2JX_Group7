<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Webmapp Group 7</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='src/leaflet.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='src/css/bootstrap.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='src/plugins/L.Control.Zoomslider.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='src/plugins/L.Control.Sidebar.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/MarkerCluster.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/MarkerCluster.Default.css') }}">
        
        <script src="{{ url_for('static', filename='src/leaflet-src.js') }}"></script>
        <script src="{{ url_for('static', filename='src/jquery-3.6.0.min.js') }}"></script>
        <script src="{{ url_for('static', filename='src/turf.min.js') }}" charset="utf-8"></script>
        <script src="{{ url_for('static', filename='src/plugins/L.Control.Zoomslider.js') }}"></script>
        <script src="{{ url_for('static', filename='src/plugins/L.Control.Sidebar.js') }}"></script>
    
        <script src="{{ url_for('static', filename='data/swedish_counties.js') }}"></script>
        <script src="{{ url_for('static', filename='data/countries.js') }}"></script>
        <script src="{{ url_for('static', filename='data/sample1.js') }}"></script>
        

        
        
        
       
        
        <style>
            #mapdiv {
                height: 100vh;
            }  
            
            #side-bar {
			position: absolute;
			z-index: 1000;
			background: rgba(255,255,255,0.7);
			padding: 10px;
			right: 0;
            top: 0;
			margin: 10px;
			border-radius: 10px;
			min-height: 200px;
            }
            /* Design av knapparna */
            #side-bar button {
                background-color: #4CAF50; 
                border: none;
                color: white;
                padding: 8px 16px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                margin: 4px 2px;
                cursor: pointer;
                border-radius: 8px; 
                transition: 0.3s;   
            }
                        
        </style>
    </head>
    <body>
       <div id="mapdiv" class="col-md-9"></div>
       
       <div id="side-bar" class="col-md-3">
            <h2>Tasks</h2>
            <h3>G</h3>
            <button id="t1">Task 1</button>
            <button id="t2">Task 2</button>
            <button id="t3">Task 3</button>
            <button id="t4">Task 4</button>
            <button id="t5">Task 5</button>
            <h3>Vg</h3>
            <button id="t6">Task 6</button>
            <button id="t7">Task 7</button>
            <button id="t8">Task 8</button>
  
       </div>

       <div id="sidebar"></div>
       
        
       <script>
            var mymap; 
            var lyrOSM; 
            var mrkCurrentLocation;
            var ctlZoomslider;
            var swedishlayer = L.geoJson(swedish_counties);
            var countrieslayer
            var ctlSlidebar;
            var sample = L.geoJson(sample);
            var sample1 = L.geoJson(sample1);
            
           
            $(document).ready(function(){
                mymap = L.map('mapdiv', {center:[60.48868922712431, 15.421371459960938], zoom:13});
                lyrOSM= L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
                mymap.addLayer(lyrOSM);
                // Initiera sidebar-kontrollen
                var sidebar = L.control.sidebar('sidebar', {
                    position: 'left'
                });
                mymap.addControl(sidebar);
                
                ctlZoomslider = L.control.zoomslider({position:'topright'}).addTo(mymap);
                

                // Task 1 
                // Punkten 
                var point = L.marker([60.484229422052806, 15.417932404301126]) 
                    .bindPopup("<h4>Kupolen</h4><p>Ett shoppingcenter i Borlänge</p><img src='static/img/Kupolen.png' width='150px'>");
                // Linjen
                var line = L.polyline([[60.48954511346011, 15.42504208778226], [60.603974949628025, 15.622487368169402]], {color: 'red'})
                    .bindPopup("<h4>Blg-Falun</h4><p>Fågelvägen mellan Borlänge och Falun</p><img src='static/img/Fagelvagen.png' width='150px'>")
                // Polygon
                var polygon = L.polygon([[61.15100465267432, 14.452944288711791], [60.906107491709776, 14.429290785709469],[60.6594017680805,15.034829030131021],[60.92096459775286,15.184183945038825],[61.02795305124883,14.68370950226361],[61.15179064615006,14.704061627751656]], {color:'Green'})
                    .bindPopup("<Siljansbygden</h4><p>Det natursköna området runt siljan</p><img src='static/img/Dalabild.png' width='150px'>")

                document.getElementById("t1").addEventListener("click", taskOne);

		          function taskOne(){
                      if(mymap.hasLayer(point)){
                          mymap.removeLayer(point); // Räcker med en här
                          mymap.removeLayer(line);
                          mymap.removeLayer(polygon);
                
                          
                      } else {
                          point.addTo(mymap);
                          line.addTo(mymap);
                          polygon.addTo(mymap);
            
                      }
			
		          };

                // Task 2 
                // 5 platser i Borlänge
                var locations = [
                   {name: "Kupolen", info: "Kupolen invigdes i september 1990 och var från början ett två våningar kombinerat köpcentrum och evenemangsarena med arenan på plan två. 1995 byggdes ett nytt våningsplan mellan befintligt köpcentrum och arenadelen och Kupolen rymde då dubbelt så många butiker som tidigare.", 
                   coords: [60.484, 15.418]},
                   {name: "Högskolan Dalarna", info: "2024 flyttade högskolan in på Campus Borlänge och blev Sveriges nyaste campus beläget mitt i centrum. På campuset samlas utbildning och forskning inom data och it, turism, samhälle, ekonomi och teknik.", 
                   coords: [60.487, 15.421]},
                   {name: "Borlänge Central", info: "Borlänge centralstation, kortform Borlänge C, är en järnvägsstation i centrala Borlänge. Här korsar Bergslagsbanan Dalabanan. Stationen har ett resecentrum för Dalatrafiks busstrafik och var också utgångspunkt för trafiken på Västerdalsbanan.", 
                   coords: [60.488, 15.430]},
                   {name: "Maserhallen", info: "Maserhallen är en idrottsanläggning för inomhusidrott i Borlänge som stod klar 1967. I Maserhallen finns det två inomhushallar, en bowlinghall, en 25 m simbassäng med hopptorn, ett äventyrsbad (Aqua Nova) med relaxavdelning och två gym.", 
                   coords: [60.479, 15.425]},
                   {name: "2047 Science Center", info: "Verksamheten öppnade 1986 under namnet Framtidsmuseet. Det var då inrymt som en del av Folkets hus i Borlänge. 2017 tog man ner skylten Framtidsmuseet och bytte namn till 2047 Science Center. Namnbytet motiverades med att man inte såg sig som ett museum utan som ett mer modernt inriktat vetenskapscentrum ", 
                   coords: [60.485, 15.420]}
];
                
                  // Skapar en grupp så att vi enkelt kan lägga till och ta bort alla markörer samtidigt
                  var task2LayerGroup = L.layerGroup();

                // Event listener för Task 2 knappen
                document.getElementById("t2").addEventListener("click", function() {
                    if (mymap.hasLayer(task2LayerGroup)) {
                        mymap.removeLayer(task2LayerGroup);
                    } 
                    // Skapa punkterna och lägg till dem
                    else {
                        locations.forEach(function(loc) {
                            var marker = L.marker(loc.coords);
                            marker.on('click', function() {
                                sidebar.setContent(`
                                    <h2>${loc.name}</h2>
                                    <hr>
                                    <p><b>Information:</b> ${loc.info}</p>
                                `);
                                sidebar.show(); 
                            });
                            task2LayerGroup.addLayer(marker); // Lägg till markern i gruppen
                        });
                        task2LayerGroup.addTo(mymap); // Lägg till hela gruppen på kartan
                        mymap.setView([60.485, 15.42], 14);
                    }

                    // Zoomar till området
                    mymap.setView([60.485, 15.42], 14);
                });

                // Task 3
                var task3LayerGroup = L.layerGroup(); // Grupp för butiker och buffertar

                document.getElementById("t3").addEventListener("click", function() {
                    // Om lagret redan finns -> Ta bort det
                    if (mymap.hasLayer(task3LayerGroup)) {
                        mymap.removeLayer(task3LayerGroup);
                    } 
                    // Kör analysen och lägg till på kartan
                    else {
                        $.getJSON("/static/data/supermarket.geoJSON", function(data) {
                            var allBuffers = [];
                            
                            // Först skapar vi butikslagret
                            var stores = L.geoJson(data, {
                                onEachFeature: function (feature, layer) {
                                    layer.bindPopup("Butik: " + feature.properties.name);
                                    allBuffers.push(turf.buffer(feature, 1, {units: 'kilometers'}));
                                }
                            });
                            task3LayerGroup.addLayer(stores); // Lägg till butiker i gruppen
                
                            // Här skapar vi buffertarna
                            allBuffers.forEach(function(currentBuffer, index) {
                                var isOverlapping = false;
                                allBuffers.forEach(function(otherBuffer, otherIndex) {
                                    if (index !== otherIndex && turf.intersect(currentBuffer, otherBuffer)) {
                                        isOverlapping = true;
                                    }
                                });
                
                                var bufferLayer = L.geoJson(currentBuffer, {
                                    style: {
                                        color: isOverlapping ? "red" : "green",
                                        fillOpacity: 0.2
                                    }
                                });
                                task3LayerGroup.addLayer(bufferLayer); // Lägg till buffer i gruppen
                            });
                
                            task3LayerGroup.addTo(mymap); // Visa allt på kartan
                            mymap.fitBounds(stores.getBounds());
                        });
                    }
                });

                // Task 6

                // platserna där vi visa temperatur
                var tempLocations = [
                   {name: "Borlänge", info: "Borlänge", 
                   coords: [60.481424756432915, 15.428001437016889]},
                   {name: "Falun", info: "Falun", 
                   coords: [60.60787960601539, 15.640291042780945]},
                   {name: "Djurås", info: "Djurås", 
                   coords: [60.559970355514906, 15.129291307869408]},
                   {name: "Leksand", info: "Leksand", 
                   coords: [60.73584063135766, 15.000834527046777]},
                   {name: "Ludvika", info: "Ludvika", 
                   coords: [60.14556030882662, 15.180324421453832]}
            ];


                // Skapar en grupp så att vi enkelt kan lägga till och ta bort alla markörer samtidigt
                  var task6LayerGroup = L.layerGroup();

                // Event listener för Task 6 knappen
                document.getElementById("t6").addEventListener("click", function() {
                    if (mymap.hasLayer(task6LayerGroup)) {
                        mymap.removeLayer(task6LayerGroup);
                    } 
                    // Skapa punkterna och lägg till dem
                    else {
                        tempLocations.forEach(function(loc) {
                            var marker = L.marker(loc.coords);
                            
                            // Här gör vi en grund popup som visas direkt innan vädret hunnit hämtas
                            marker.bindPopup(`
                            <div>
                            <h4>${loc.name}</h4>
                            <p>Väderdata hämtas...</p>
                            </div>`
                            );

                            marker.on('click', function() {
                                sidebar.setContent(`
                                    <h2>${loc.name}</h2>
                                    <hr>
                                    <p><b>Väderprognos:</b> ${loc.info}</p>
                                `);
                                sidebar.show(); 
                            });
                            task6LayerGroup.addLayer(marker); // Lägg till markern i gruppen
                        });
                        task6LayerGroup.addTo(mymap); // Lägg till hela gruppen på kartan
                        // Zomma till rimlig nivå
                        mymap.setView([60.507855040518876, 15.382499006468237], 10);
                    }

                });

             });
            

            
       </script>
    </body>
</html>
